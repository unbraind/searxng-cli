name: Auto Release

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      push:
        description: Push the release commit and tag
        type: boolean
        required: false
        default: false
      dry_run:
        description: Run the complete pipeline without retaining changes
        type: boolean
        required: false
        default: true

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install pm CLI
        run: npm install --global @unbrained/pm-cli@latest
      - name: Resolve execution mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_PAT_CONFIGURED: ${{ secrets.RELEASE_PAT != '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            push=true
            dry_run=false
          else
            push="${INPUT_PUSH:-false}"
            dry_run="${INPUT_DRY_RUN:-true}"
          fi
          if [[ "$push" == "true" && "$dry_run" == "true" ]]; then
            echo "push=true and dry_run=true are mutually exclusive"
            exit 2
          fi
          if [[ "$push" != "true" && "$dry_run" != "true" ]]; then
            echo "A non-pushing workflow dispatch must use dry_run=true"
            exit 2
          fi
          if [[ "$push" == "true" && "$RELEASE_PAT_CONFIGURED" != "true" ]]; then
            echo "RELEASE_PAT is required for protected-branch and tag pushes."
            exit 1
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
      - name: Run release pipeline
        id: release
        env:
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          args=(--json)
          [[ "${{ steps.mode.outputs.push }}" == "true" ]] && args+=(--push)
          [[ "${{ steps.mode.outputs.dry_run }}" == "true" ]] && args+=(--dry-run)
          node scripts/release/run-release-pipeline.mjs "${args[@]}" | tee release-result.json
      - name: Wait for tag publication workflow
        if: steps.mode.outputs.push == 'true' && steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow release.yml --event push --branch "$tag" --limit 10 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo "Release workflow did not start for $tag"; exit 1; }
          gh run watch "$run_id" --exit-status --interval 20
      - name: Record scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Scheduled Auto Release failed on ${GITHUB_SHA}. Inspect ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          existing="$(gh issue list --state open --search 'Auto Release blocked: scheduled run failed in:title' --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then gh issue comment "$existing" --body "$body"; else gh issue create --title 'Auto Release blocked: scheduled run failed' --body "$body"; fi
