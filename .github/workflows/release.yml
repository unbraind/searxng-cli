name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm install --global @unbrained/pm-cli@latest
      - name: Verify tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo "Tag $RELEASE_TAG does not match package version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - run: bun audit
      - name: Run tag release gates
        run: |
          set -euo pipefail
          # The preceding step validates the immutable tag/package pair. The
          # pre-tag version:check intentionally predicts the next version and
          # therefore must not run after this tag already exists.
          bun run version:audit
          bun run lint
          bun run secrets:history
          bun run clean
          bun run build
          bun run test:unit
          bun run smoke:package
          npm pack --dry-run >/dev/null
      - run: bun run changelog:pm:check
      - run: bun run changelog:preservation:check
      - run: npm pack --dry-run
      - name: Detect recovery publication
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "searxng-cli@$VERSION" version >/dev/null 2>&1; then echo "published=true" >> "$GITHUB_OUTPUT"; else echo "published=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish to npm with provenance
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm and Bun consumers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/verify-published-release.mjs --version "$VERSION"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --verify-tag --latest
          else
            gh release create "$TAG" --verify-tag --generate-notes --latest --title "$TAG"
          fi
